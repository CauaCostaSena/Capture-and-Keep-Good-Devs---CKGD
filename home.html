<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface Intel</title>
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <aside class="sidebar" aria-label="Barra lateral">
        <div class="company-card" role="region" aria-labelledby="company-name">
            <div class="logo" aria-hidden="true">intel</div>

            <div class="company-info">
                <h1 id="company-name" class="company-name">Intel. Inc</h1>
                <p class="company-location">
                    Santa Clara, Califórnia<br>EUA
                </p>
            </div>
        </div>

        <nav class="menu-card" aria-label="Menu principal">
            <a class="menu-item"><span class="icon">🔖</span> Salvos</a>
            <a class="menu-item active"><span class="icon">🔍</span> Análises</a>
            <a class="menu-item"><span class="icon">⚙️</span> Configurações</a>
            <a class="menu-item"><span class="icon">🎧</span> Suporte</a>
            <a class="menu-item"><span class="icon">🧾</span> Assinatura</a>
        </nav>
    </aside>

    <main class="main-content">
        
        <div class="search-bar">
            <input type="text" placeholder="Pesquise desenvolvedores">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>

        <div class="status-center">
            <div class="loader-container">
                <div class="dashed-circle"></div>
                <i class="fa-solid fa-hourglass-half hourglass-icon"></i>
            </div>
            <h2 class="status-text">
                Esperando para encontrar o<br>
                próximo talento
            </h2>
        </div>
    
    </main>

</body>
</html>
