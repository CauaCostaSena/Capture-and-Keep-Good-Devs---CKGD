<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre na sua conta CKGD para buscar desenvolvedores com base em dados reais do GitHub.">
    <title>Login - CKGD</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <main id="main.login">
        <div id="container-login">

            <!-- ESQUERDA - FORMULÁRIO -->
            <div id="left-panel">
                <div id="login-box">

                    <div class="brand">
                        <span class="brand-mark" aria-hidden="true">C</span>
                        <span class="brand-name">CKGD</span>
                    </div>

                    <h2 id="login-title">Bem-vindo de volta</h2>
                    <p class="login-subtitle">Entre para continuar buscando talentos.</p>

                    <div class="input-group">
                        <input type="email" placeholder="E-mail" id="input-usuario">
                    </div>

                    <div class="input-group">
                        <input type="password" placeholder="Senha" id="input-senha">
                    </div>

                    <button id="btn-login" class="btn btn-primary btn-block">Entrar</button>
                    <button id="btn-cadastro" class="btn btn-secondary btn-block">Criar conta de empresa</button>
                    <button id="btn-cadastro-candidato" class="btn btn-secondary btn-block">Criar conta de candidato</button>

                    <a href="recuperar-senha.html" id="forgot-password">Esqueceu a Senha?</a>

                </div>
            </div>

            <!-- DIREITA - IMAGEM -->
            <div id="right-panel">
                <img id="login-illustration"
                     src="images/Imagem - Login.svg"
                     alt="Ilustração de Programação">
            </div>

        </div>
    </main>

    <footer id="footer">
        <p>&copy; 2026 CKGD — Capture and Keep Good Devs</p>
    </footer>


    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
