<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <header id="header.login">
        <h1>CKGD - Login/Cadastro</h1>
    </header>

    <main id="main.login">
        <div id="container-login">

            <!-- ESQUERDA - FORMULÁRIO -->
            <div id="left-panel">
                <div id="login-box">

                    <h2 id="login-title">Login</h2>

                    <div class="input-group">
                        <input type="text" placeholder="Usuário">
                    </div>

                    <div class="input-group">
                        <input type="password" placeholder="Senha">
                    </div>

                    <button id="btn-cadastro">Cadastro</button>
                    <button id="btn-login">Login</button>

                    <a href="#" id="forgot-password">Esqueceu a Senha?</a>

                </div>
            </div>

            <!-- DIREITA - IMAGEM -->
            <div id="right-panel">
                <img id="login-illustration"
                     src="/mnt/data/c61b87fa-d3a5-4250-9619-1f31f1fb799d.png"
                     alt="Ilustração de Programação">
            </div>

        </div>
    </main>

    <footer id="footer">
        <p>2025 - Meu Projeto</p>
    </footer>

</body>
</html>
