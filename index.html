<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <main id="main.login">
        <div id="container-login">

            <!-- ESQUERDA - FORMULÁRIO -->
            <div id="left-panel">
                <div id="login-box">

                    <h2 id="login-title">Login</h2>

                    <div class="input-group">
                        <input type="text" placeholder="Usuário" id="input-usuario">
                    </div>

                    <div class="input-group">
                        <input type="password" placeholder="Senha" id="input-senha">
                    </div>

                    <button id="btn-cadastro">Cadastro</button>
                    <button id="btn-login">Login</button>

                    <a href="#" id="forgot-password">Esqueceu a Senha?</a>

                </div>
            </div>

            <!-- DIREITA - IMAGEM -->
            <div id="right-panel">
                <img id="login-illustration"
                     src="images/Imagem - Login.svg"
                     alt="Ilustração de Programação">
            </div>

        </div>
    </main>

    <footer id="footer">
        <p>2025 - Meu Projeto</p>
    </footer>


    <script src="js/login.js"></script>
</body>
</html>
