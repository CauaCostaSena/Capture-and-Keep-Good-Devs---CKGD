<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crie a conta da sua empresa na CKGD e comece a buscar desenvolvedores.">
    <title>Cadastro de Empresa - CKGD</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>

    <main id="main.cadastro">
        <div id="container-cadastro">

            <div id="left-panel-cadastro">
                <div id="cadastro-box">

                    <div class="brand brand-center">
                        <span class="brand-mark" aria-hidden="true">C</span>
                        <span class="brand-name">CKGD</span>
                    </div>

                    <h2 id="cadastro-title">Cadastro de Empresa</h2>
                    <p id="cadastro-subtitle">Crie a conta da sua empresa para começar a buscar desenvolvedores.</p>

                    <form id="form-cadastro">

                        <div class="grid-2">
                            <div class="input-group">
                                <label for="input-nome-empresa">Nome da Empresa *</label>
                                <input type="text" id="input-nome-empresa" required>
                            </div>
                            <div class="input-group">
                                <label for="input-cnpj">CNPJ (14 dígitos) *</label>
                                <input type="text" id="input-cnpj" maxlength="14" placeholder="Somente números" required>
                            </div>
                        </div>

                        <div class="grid-2">
                            <div class="input-group">
                                <label for="input-email">E-mail *</label>
                                <input type="email" id="input-email" required>
                            </div>
                            <div class="input-group">
                                <label for="input-senha">Senha *</label>
                                <input type="password" id="input-senha" required minlength="6">
                            </div>
                        </div>

                        <div class="grid-2">
                            <div class="input-group">
                                <label for="input-pais">País *</label>
                                <input type="text" id="input-pais" required>
                            </div>
                            <div class="input-group">
                                <label for="input-estado">Estado *</label>
                                <input type="text" id="input-estado" required>
                            </div>
                        </div>

                        <div class="grid-2">
                            <div class="input-group">
                                <label for="input-cidade">Cidade *</label>
                                <input type="text" id="input-cidade" required>
                            </div>
                            <div class="input-group">
                                <label for="input-bairro">Bairro *</label>
                                <input type="text" id="input-bairro" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="input-endereco">Endereço *</label>
                            <input type="text" id="input-endereco" required>
                        </div>

                        <div class="input-group">
                            <label for="input-plano">Plano de Assinatura</label>
                            <select id="input-plano">
                                <option value="">Carregando planos...</option>
                            </select>
                        </div>

                        <button type="submit" id="btn-finalizar-cadastro" class="btn btn-primary btn-block">Finalizar Cadastro</button>
                        <a href="index.html" id="voltar-login">Já tenho conta — Voltar ao Login</a>

                    </form>

                </div>
            </div>

        </div>
    </main>

    <footer id="footer">
        <p>&copy; 2026 CKGD — Capture and Keep Good Devs</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/cadastro.js"></script>
</body>
</html>
